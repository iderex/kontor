# Three refusals about what a second clone will read, and the evidence that all
# three bite. The first two read the index rather than the working tree, because
# a clone with core.autocrlf set writes CRLF into its working tree from an LF
# blob, and a check reading that working tree would refuse a tree that is
# correct. The third remakes every generated file and refuses a difference.
#
# Each job runs a script from the tree instead of holding the rule in a run:
# block, so a contributor can ask the same question before pushing and get the
# same answer. docs/layout.md is where that is argued.
name: text-determinism

on:
  # The pull request event, and the default branch on push. A commit that is in
  # a pull request is judged once under each name here, and the default branch is
  # judged again when the merge lands on it.
  #
  # It said every branch and every pull request until this commit, with the
  # reason that the rule is about what is committed and has to hold on a branch
  # that never becomes a pull request. The reason was true and the arrangement
  # did not serve it. A commit that is both pushed and in a pull request was
  # judged twice under every name, and a name carried by two runs of two events
  # is a name whose meaning depends on how the platform resolves the duplicate,
  # which is what docs/required-checks.md says has to be settled before any of
  # these can be required of a merge. A branch that never becomes a pull request
  # also never reaches the default branch, so what the old arrangement bought was
  # a verdict on work that cannot land, at the price of the verdict that gates
  # work that can.
  #
  # zizmor.yml already had this shape and its name was already carried by one
  # run rather than two, so this is the tree agreeing with itself rather than a
  # new position.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Read-only. Two jobs only read, and the two that remake a generated file write
# it into the runner's own checkout and never back here: the difference is the
# finding, and a job that could push would erase it.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push does not queue behind an
# obsolete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-carriage-return:
    name: Reject a carriage return in tracked text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config.
          persist-credentials: false
      - name: Reject a carriage return in tracked text
        run: ./text-scan line-endings

  utf8-no-bom:
    name: Reject non UTF-8 and byte order marks in tracked text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject non UTF-8 and byte order marks in tracked text
        run: ./text-scan encoding

  generated:
    name: Reject a generated file that is not what its generator writes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The file, not a version.
          node-version-file: .nvmrc

      - name: Remake every generated file and refuse a difference
        # A hand edit to a generated file survives because nothing writes over
        # it. This writes over it.
        run: ./regenerate --check

  proof:
    name: Prove the determinism gates bite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run every leg
        # A gate that has never refused anything is a claim rather than a
        # control. Each leg builds a fixture, runs the shipped script against it
        # and reads the exit code, so a rule loosened where it lives reddens the
        # leg that depended on it.
        run: ./prove-determinism
