name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name is written out, like every other job in this tree. It used to be
  # left off, and the comment saying why named a ruleset called "Protect main"
  # and a required status check inside it. Neither exists. What the repository
  # holds is one ruleset, and it requires no check at all:
  #
  #     gh api repos/iderex/kontor/rulesets --jq '.[] | {name, target}'
  #     {"name":"gate","target":"branch"}
  #     gh api repos/iderex/kontor/rulesets/20486686 \
  #       --jq '{required: [.rules[].type], checks: [.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[]?.context]}'
  #     {"required":["deletion","non_fast_forward","pull_request","required_signatures"],"checks":[]}
  #
  # So nothing was matching this check name, and the reason for leaving it
  # derived from the job id was a mechanism nobody had looked at. The `checks`
  # list is still empty, which is the half this comment rests on and the half
  # that has not moved. What did move is the rule list: the output above ended
  # at "pull_request" until the commit carrying this line, and re-running the
  # command returns a fourth entry. #187 is where that was found, and
  # docs/required-checks.md is where the names this repository asks to stand in
  # front of the branch are written down. #108 named them and is closed; naming
  # them is not the same act as requesting them, and nothing here waits on it.
  dependency-review:
    name: Review new dependencies against the advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
