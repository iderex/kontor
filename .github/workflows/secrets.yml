# A credential written into a file and committed is in every clone of this
# repository, in every fork of it, and in the history after somebody takes it
# out of the file again. Rotating it at the service that issued it is the only
# repair, so the moment worth catching one is before the merge rather than
# after, and the check has to run where the merge is decided rather than only in
# a terminal somebody remembered to use.
#
# Each job runs a script from the tree instead of holding the rule in a run:
# block, so a contributor can ask the same question before pushing and get the
# same answer. docs/layout.md is where that is argued.
name: secrets

on:
  # The pull request event, and the default branch on push. A commit that is in
  # a pull request is judged once under each name here, and the default branch is
  # judged again when the merge lands on it. The reasoning is the same as in
  # text-determinism.yml, which is where it is written out.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Read-only. Both jobs read, and neither writes anything back here.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push does not queue behind an
# obsolete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed:
    name: Reject a credential shape nothing declares
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Reject a credential shape nothing declares
        # The refusal names the file, the line and the shape and never the
        # value, so the log of a failing run does not become the second place
        # the credential is published.
        run: ./secret-scan

  proof:
    name: Prove the credential scan bites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run every leg
        # A gate that has never refused anything is a claim rather than a
        # control. Each leg builds a fixture repository, runs the shipped script
        # against it and reads the exit code, so a shape loosened where it lives
        # reddens the leg that depended on it. One leg reads what the refusal did
        # not say, which no exit code can show.
        run: ./prove-secret-scan
